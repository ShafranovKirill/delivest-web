<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/delivest-logo/logo-white.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/env-config.js"></script>
    <script>
      ;(function () {
        var mode = localStorage.getItem('delivest-theme') || 'light'
        var dark =
          mode === 'dark' ||
          (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <title>delivest-web</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
